server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Precisa acompanhar MAX_UPLOAD_MB do backend, senão o nginx
    # devolve 413 antes de a requisição chegar na API (default: 1m).
    client_max_body_size 100m;

    # SPA: rotas do react-router caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy da API para o backend
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads/downloads grandes não podem estourar o timeout padrão.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Os arquivos NÃO são servidos como estáticos: o download passa por
    # /api/documentos/arquivos/{id}/download, que exige token.
}
