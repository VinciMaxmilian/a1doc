# Variáveis obrigatórias (sem default por segurança) — defina num .env na raiz:
#   MYSQL_ROOT_PASSWORD, SECRET_KEY, ADMIN_PASSWORD
# Gere a SECRET_KEY com:
#   python -c "import secrets; print(secrets.token_urlsafe(48))"

x-backend-env: &backend-env
  DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD}@db:3306/${MYSQL_DATABASE:-indoc}
  REDIS_URL: redis://redis:6379/0
  UPLOAD_DIR: /data/uploads
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # O schema é gerenciado pelo Alembic, não pelo create_all do startup.
  AUTO_CREATE_TABLES: "false"

services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-indoc}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *backend-env
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@indoc.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD}
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A celery_app worker --loglevel=info --pool=solo
    environment:
      <<: *backend-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
  uploads:
